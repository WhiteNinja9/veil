name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Cache verified model downloads
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run models
      - run: npm run package
      - run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: veil-packages
          path: artifacts/
          retention-days: 14

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cache verified model downloads
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run models
      - run: node scripts/fetch-eval-images.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
